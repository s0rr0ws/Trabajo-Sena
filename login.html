<body data-page="login" class="player-page"><main class="player-shell"><section class="player-copy"><a class="logo" href="index.html"><span>◆</span>PrismaShift</a><p class="kicker">Antes de empezar</p><h1>Crea tu perfil de jugador.</h1><p>Este formulario simula el registro que después podría almacenarse en MySQL. Por ahora los datos se guardan únicamente en el navegador.</p><div class="state-demo"><span class="standing-demo"></span><b>DE PIE</b><span class="lying-demo"></span><b>ACOSTADO</b></div></section><section class="player-card"><a href="index.html">← Volver</a><h2>Registro de partida</h2><form id="playerForm"><label for="playerName">Nombre o alias</label><input id="playerName" required maxlength="30" placeholder="Ej. Equipo Cóndor"><label for="playerCourse">Curso</label><input id="playerCourse" required maxlength="15" placeholder="10-01"><label for="playerSchool">Institución</label><input id="playerSchool" required maxlength="80" placeholder="Nombre del colegio"><label class="consent"><input id="rulesAccepted" type="checkbox" required> Comprendo que es una demostración académica.</label><p id="playerError" class="error-message"></p><button class="game-button full" type="submit">Entrar al juego</button></form></section></main><script src="assets/js/game.js"></script></body></html>
