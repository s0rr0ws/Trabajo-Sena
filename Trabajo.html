<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="Trabajo.css">
    <link rel="stylesheet" href="Trabajo.js">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="Top">
            <img src="https://i.redd.it/q1xhhsof1pe81.gif" alt="" height="70" width="70" class="logo">
            <h1 class="titulo-principal">Proyecto Sena</h1>
            <button class="silencio">Mute</button>
        </div>
    </header>
    <main>
        <!-- Pagina principal -->
        <div class="main-page">
        <!-- Botones de interaccion -->
            <div class="Option-buttons">
                <ul>
                    <!-- Cambia el link dentro del "window.location.href='https://google.com'" para cambiar la pagina de redireccion -->
                    <li><button class="Settings" onclick="window.location.href='https://google.com'">Ajustes</button></li>
                    <li><button class="Controls" onclick="window.location.href='https://google.com'">Controles</button></li>
                    <li><button class="Save" onclick="window.location.href='https://google.com'">Guardado</button></li>
                </ul>
            </div>
            <!-- Juego principal -->
            <div class="Main-game">
                <!-- Boton para iniciar el juego, ajusta el tamaño del triangulo con el height y width -->
                <button>
                    <img src="https://icons.veryicon.com/png/o/miscellaneous/common-icons-of-software-interface/triangle-play.png" alt="" height="20" width="20">
                    Jugar
                </button>
            </div>
            <!-- Link de cuenta -->
            <div class="Button-account">
                <button class="Account" onclick="window.location.href='https://google.com'">Cuenta</button>
            </div>
            <!-- Boton de salir de la pagina -->
            <div class="Button-exit">
                <button class="Exit" onclick="window.location.href='https://google.com'">Salir</button>
            </div>
            <!-- Personaje interactuable -->
             <div class="Character">
                <img src="https://i.redd.it/kgegurof1pe81.gif" alt="">
            </div>
        </div>
    </main>
    <footer>
        <div class="Credits">
        <p><b>Desarrollado por:</b><br>Javier Alfonso<br>Camilo Veloza<br>Angel Torres<br>Freddy Pardo</p>
        </div>
    </footer>
</body>
</html>
